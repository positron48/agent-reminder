name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            rust_targets: aarch64-apple-darwin
            tauri_script: bash scripts/tauri-build-mac.sh
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            rust_targets: x86_64-apple-darwin
            tauri_script: bash scripts/tauri-build-mac.sh
          - platform: ubuntu-22.04
            args: ""
            rust_targets: ""
            tauri_script: ""
          - platform: windows-latest
            args: ""
            rust_targets: ""
            tauri_script: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            patchelf

      - name: Install frontend dependencies
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Agent Reminder v__VERSION__
          releaseBody: |
            ## Agent Reminder

            Tray/menu bar app for tracking AI agent rate limit countdowns.

            ### Downloads
            - **macOS:** `.dmg` (Apple Silicon or Intel, see asset name)
            - **Windows:** `.msi` / `.exe`
            - **Linux:** `.AppImage`, `.deb`, `.rpm`
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
          tauriScript: ${{ matrix.tauri_script || 'npm run tauri' }}
