[package]
name = "agent-reminder"
version = "0.1.0"
description = "Tray app for AI agent rate limit countdowns"
authors = ["you"]
edition = "2021"

[lib]
name = "agent_reminder_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "image-png"] }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rodio = { version = "0.19", features = ["wav"] }
resvg = "0.45"
usvg = "0.45"
tiny-skia = "0.11"

[target.'cfg(target_os = "macos")'.dependencies]
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2.1" }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication"] }
objc2-foundation = "0.3"
