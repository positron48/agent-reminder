<svg xmlns="http://www.w3.org/2000/svg" width="660" height="520" viewBox="0 0 660 520">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3a3c"/>
      <stop offset="100%" stop-color="#2c2c2e"/>
    </linearGradient>
  </defs>
  <rect width="660" height="520" fill="url(#bg)"/>

  <path d="M 300 250 L 360 250 M 345 238 L 360 250 L 345 262" fill="none" stroke="#8e8e93" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="40" y="330" width="580" height="160" rx="14" fill="#1c1c1e" fill-opacity="0.72" stroke="#48484a" stroke-width="1"/>

  <text x="330" y="365" text-anchor="middle" fill="#f2f2f7" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600">
    If macOS blocks the app on first launch
  </text>

  <text x="330" y="395" text-anchor="middle" fill="#d1d1d6" font-family="Helvetica, Arial, sans-serif" font-size="12">
    1. Drag Agent Reminder to Applications, then right-click the app - Open
  </text>
  <text x="330" y="418" text-anchor="middle" fill="#d1d1d6" font-family="Helvetica, Arial, sans-serif" font-size="12">
    2. Or: System Settings - Privacy and Security - Open Anyway
  </text>

  <text x="330" y="455" text-anchor="middle" fill="#8e8e93" font-family="Helvetica, Arial, sans-serif" font-size="11">
    Expected for unsigned open-source builds. After the first launch, opens normally.
  </text>
</svg>
